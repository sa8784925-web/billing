<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GST Tax Invoice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         EDITOR / BILLING FORM
    ========================== -->

    <div class="editor">

        <div class="editor-header">
            <h2>Billing System</h2>

            <div class="editor-actions">
                <button onclick="newInvoice()" class="btn gray">
                    New Invoice
                </button>

                <button onclick="printInvoice()" class="btn blue">
                    🖨 Print A4 Invoice
                </button>
            </div>
        </div>


        <!-- BUSINESS DETAILS -->

        <div class="form-section">

            <h3>Business Details</h3>

            <div class="form-grid">

                <div>
                    <label>Business Name</label>
                    <input
                        id="businessName"
                        value="SAVISTA BATTERIES"
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>GSTIN</label>
                    <input
                        id="businessGSTIN"
                        value=""
                        oninput="updateInvoice()">
                </div>

                <div class="wide">
                    <label>Address</label>
                    <input
                        id="businessAddress"
                        value="Dahegaon (rangari), Bhoyar complex"
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>City / State / PIN</label>
                    <input
                        id="businessCity"
                        value="Nagpur, MAHARASHTRA, 441113"
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>Mobile</label>
                    <input
                        id="businessMobile"
                        value="+91 9011711290"
                        oninput="updateInvoice()">
                </div>

            </div>

        </div>


        <!-- CUSTOMER DETAILS -->

        <div class="form-section">

            <h3>Customer Details</h3>

            <div class="form-grid">

                <div>
                    <label>Customer Name</label>
                    <input
                        id="customerName"
                        value=""
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>Customer Phone</label>
                    <input
                        id="customerPhone"
                        value=""
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>Customer GSTIN</label>
                    <input
                        id="customerGSTIN"
                        placeholder="Optional"
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>Customer Address</label>
                    <input
                        id="customerAddress"
                        placeholder="Optional"
                        oninput="updateInvoice()">
                </div>

            </div>

        </div>


        <!-- INVOICE DETAILS -->

        <div class="form-section">

            <h3>Invoice Details</h3>

            <div class="form-grid">

                <div>
                    <label>Invoice Number</label>
                    <input
                        id="invoiceNumber"
                        value="INV-4"
                        oninput="updateInvoice()">
                </div>

                <div>
                    <label>Invoice Date</label>
                    <input
                        type="date"
                        id="invoiceDate"
                        onchange="updateInvoice()">
                </div>

                <div>
                    <label>Due Date</label>
                    <input
                        type="date"
                        id="dueDate"
                        onchange="updateInvoice()">
                </div>

                <div>
                    <label>Place of Supply</label>
                    <input
                        id="placeSupply"
                        value="27-MAHARASHTRA"
                        oninput="updateInvoice()">
                </div>

            </div>

        </div>


        <!-- ITEMS -->

        <div class="form-section">

            <div class="section-heading">

                <h3>Items</h3>

                <button
                    onclick="addItem()"
                    class="btn green">
                    + Add Item
                </button>

            </div>


            <div class="items-editor">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Item</th>
                            <th>HSN/SAC</th>
                            <th>Qty</th>
                            <th>Rate</th>
                            <th>GST %</th>
                            <th>Discount</th>
                            <th></th>
                        </tr>

                    </thead>

                    <tbody id="editorItems">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- PAYMENT -->

        <div class="form-section">

            <h3>Payment</h3>

            <div class="form-grid">

                <div>
                    <label>Payment Status</label>

                    <select id="paymentStatus"
                            onchange="updateInvoice()">

                        <option value="paid">
                            Amount Paid
                        </option>

                        <option value="unpaid">
                            Amount Due
                        </option>

                    </select>

                </div>

                <div>
                    <label>Payment Method</label>

                    <select id="paymentMethod"
                            onchange="updateInvoice()">

                        <option>Cash</option>
                        <option>UPI</option>
                        <option>Bank Transfer</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>

                    </select>

                </div>

                <div>
                    <label>Notes</label>

                    <input
                        id="notes"
                        placeholder="Optional notes"
                        oninput="updateInvoice()">

                </div>

            </div>

        </div>

    </div>
<script src="script.js"></script>

</body>
</html>
